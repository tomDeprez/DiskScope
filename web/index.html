<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DiskScope</title>
<style>
:root{
  --bg:#0a0c11;--panel:#11141b;--panel2:#161a23;--line:#222837;--tx:#e7eaf1;--mut:#8a93a8;
  --acc:#8b5cf6;--acc2:#22d3ee;--warn:#f59e0b;--crit:#ef4444;--ok:#22c55e;--run:#4ade80;
  --mono:ui-monospace,"Cascadia Code","JetBrains Mono",Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--tx);font:14px/1.45 "Segoe UI Variable Text","Segoe UI",Ubuntu,Cantarell,system-ui,sans-serif;
  background:var(--bg);}
button{font:inherit;color:inherit;cursor:pointer}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:20px;padding:14px 28px;
  background:rgba(10,12,17,.75);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:.2px}
.logo{width:26px;height:26px;border-radius:8px;background:conic-gradient(from 200deg,var(--acc),var(--acc2),var(--acc));
}
#hdr-info{flex:1;color:var(--mut);font-size:13px;display:flex;gap:18px;flex-wrap:wrap}
#hdr-info b{color:var(--tx);font-weight:600}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 14px;transition:.15s}
.btn:hover{border-color:#3a4258;background:#1c2130}
.btn.primary{background:linear-gradient(135deg,var(--acc),#6d28d9);border:0;font-weight:600}
.btn.primary:hover{filter:brightness(1.12)}
main{max-width:1500px;margin:0 auto;padding:28px}

/* home */
.hero h1{font-size:34px;margin:30px 0 6px;letter-spacing:-.5px}
.hero h1 span{color:var(--acc2)}
.hero p{color:var(--mut);margin:0 0 26px}
.drives{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.drive{text-align:left;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:16px;
  padding:18px;transition:.18s}
.drive:hover{transform:translateY(-2px);border-color:var(--acc);box-shadow:0 8px 24px -10px rgba(0,0,0,.6)}
.drive-top{display:flex;justify-content:space-between;align-items:center}
.drive-letter{font-size:24px;font-weight:700;font-family:var(--mono)}
.drive-label{color:var(--mut);margin:4px 0 14px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;background:#1f2533;color:var(--mut);border:1px solid var(--line);white-space:nowrap}
.tag.run{color:var(--run);border-color:rgba(74,222,128,.35);background:rgba(74,222,128,.08)}
.tag.warn{color:var(--warn);border-color:rgba(245,158,11,.35);background:rgba(245,158,11,.08)}
.bar{height:8px;border-radius:99px;background:#1c2130;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.bar i.warn{background:linear-gradient(90deg,#f59e0b,#f97316)}
.bar i.crit{background:linear-gradient(90deg,#f97316,#ef4444)}
.drive-nums{display:flex;justify-content:space-between;margin-top:10px;font-size:12px;color:var(--mut)}
.drive-nums b{color:var(--tx)}
.custom{display:flex;gap:10px;margin-top:22px;max-width:640px}
.custom input{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;color:var(--tx);font:13px var(--mono)}
.custom input:focus{outline:none;border-color:var(--acc)}

/* scan */
.scan-card{max-width:760px;margin:60px auto;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:40px}
.radar{width:84px;height:84px;margin:0 auto 18px;border-radius:50%;border:2px solid #263046;position:relative;overflow:hidden}
.radar:after{content:"";position:absolute;inset:0;background:conic-gradient(from 0deg,transparent 0 70%,rgba(34,211,238,.7));animation:spin 1.1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.scan-card h2{font-family:var(--mono);font-weight:600;margin:0 0 24px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px 8px}
.stat .v{font:600 22px var(--mono)}
.stat .l{color:var(--mut);font-size:12px}
.cur{color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:rtl;text-align:left;margin-bottom:22px}

/* results */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs button{background:none;border:0;padding:10px 16px;color:var(--mut);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--tx);border-color:var(--acc)}
.tabs .count{font-size:11px;margin-left:6px;color:var(--mut)}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font:13px var(--mono);margin-bottom:14px}
.crumbs button{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px 10px}
.crumbs button:hover{border-color:var(--acc)}
.crumbs .sep{color:#3d4560}
.crumbs .sum{margin-left:auto;color:var(--mut);font-family:inherit}
.procbox{background:linear-gradient(90deg,rgba(74,222,128,.07),transparent);border:1px solid rgba(74,222,128,.25);border-radius:14px;padding:12px 16px;margin-bottom:14px}
.procbox summary{cursor:pointer;list-style:none}.procbox summary::-webkit-details-marker{display:none}
.procbox h3{margin:0;font-size:13px;color:var(--run);display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--run)}
.procbox.none{background:none;border-color:var(--line);color:var(--mut);font-size:13px}
.explore{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px}
@media (max-width:1100px){.explore{grid-template-columns:1fr}}
.treemap{position:relative;height:620px;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.tile{position:absolute;overflow:hidden;padding:6px 8px;border:1px solid var(--bg);border-radius:6px;font-size:12px;
  background:linear-gradient(135deg,hsl(var(--h) 62% 46%),hsl(var(--h) 58% 32%));transition:filter .12s}
.tile.dir{cursor:pointer}
.tile.file{background:linear-gradient(135deg,#323a4f,#242a39)}
.tile.other{background:repeating-linear-gradient(45deg,#1c2130 0 6px,#20263a 6px 12px);color:var(--mut)}
.tile:hover{filter:brightness(1.25)}
.tile b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.tile span{font-family:var(--mono);opacity:.85;font-size:11px}
.list{background:var(--panel);border:1px solid var(--line);border-radius:14px;height:620px;overflow:auto}
.row{display:grid;grid-template-columns:22px minmax(0,1fr) 90px 70px 52px 82px;gap:10px;align-items:center;padding:8px 14px;border-bottom:1px solid #1a1f2b}
.row.is-dir{cursor:pointer}
.row:hover{background:#171c27}
.row .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:6px;align-items:center}
.row .nm span.t{overflow:hidden;text-overflow:ellipsis}
.row .meta,.row .pct{color:var(--mut);font-size:12px;text-align:right;font-family:var(--mono)}
.row .sz{text-align:right;font-family:var(--mono);font-weight:600}
.pbar{height:6px;border-radius:99px;background:#1c2130;overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.row.file .pbar i{background:#4b5570}
.ic{width:18px;height:18px;color:var(--acc2)}
.row.file .ic{color:var(--mut)}
.more{padding:10px 14px;color:var(--mut);font-size:12px}
.empty{padding:40px;text-align:center;color:var(--mut)}

table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
th,td{padding:9px 14px;text-align:left;border-bottom:1px solid #1a1f2b;font-size:13px}
th{color:var(--mut);font-weight:500;font-size:12px;background:var(--panel2);position:sticky;top:0}
td.r,th.r{text-align:right}
td.path{font-family:var(--mono);font-size:12px;color:var(--mut);max-width:0;width:50%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
tr.click{cursor:pointer}
tr.click:hover td{background:#171c27}
.types{display:grid;gap:6px}
.trow{display:grid;grid-template-columns:150px 1fr 110px 90px;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px}
.trow .bar{height:10px}
.hint{color:var(--mut);font-size:12px;margin:0 0 12px}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#2a1215;border:1px solid var(--crit);padding:10px 18px;border-radius:10px;z-index:20}
@media (max-width:700px){main{padding:16px}header{padding:12px 16px}.stats{grid-template-columns:repeat(2,1fr)}
  .row{grid-template-columns:22px minmax(0,1fr) 70px}.row .meta,.row .pbar,.row .pct{display:none}.treemap{height:380px}}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="logo"></span>DiskScope</div>
  <div id="hdr-info"></div>
  <button class="btn" id="btn-rescan" hidden>↻ Rescanner</button>
  <button class="btn" id="btn-home" hidden>Changer de disque</button>
</header>

<main>
  <section id="v-home" hidden>
    <div class="hero">
      <h1>Qu'est-ce qui <span>remplit ton disque</span> ?</h1>
      <p>Choisis un disque ou un dossier. Le scan est parallèle et ne suit ni les liens ni les jonctions.</p>
    </div>
    <div id="drives" class="drives"></div>
    <form id="custom" class="custom">
      <input id="custom-path" placeholder="Ou un dossier précis : D:\Projets, /home/moi…" spellcheck="false">
      <button class="btn primary">Analyser</button>
    </form>
  </section>

  <section id="v-scan" hidden>
    <div class="scan-card">
      <div class="radar"></div>
      <h2 id="scan-root"></h2>
      <div class="stats">
        <div class="stat"><div class="v" id="s-size">0</div><div class="l">analysés</div></div>
        <div class="stat"><div class="v" id="s-files">0</div><div class="l">fichiers</div></div>
        <div class="stat"><div class="v" id="s-dirs">0</div><div class="l">dossiers</div></div>
        <div class="stat"><div class="v" id="s-rate">0</div><div class="l">fichiers / s</div></div>
      </div>
      <div class="cur mono" id="scan-cur"></div>
      <button class="btn" id="btn-cancel">Annuler</button>
    </div>
  </section>

  <section id="v-res" hidden>
    <nav class="tabs" id="tabs">
      <button data-t="explore" class="on">Explorateur</button>
      <button data-t="files">Plus gros fichiers</button>
      <button data-t="dirs">Dossiers les plus lourds</button>
      <button data-t="types">Par type</button>
      <button data-t="procs">Programmes lancés<span class="count" id="proc-count"></span></button>
    </nav>

    <div id="t-explore">
      <div class="crumbs" id="crumbs"></div>
      <div id="procbox"></div>
      <div class="explore">
        <div id="treemap" class="treemap"></div>
        <div id="list" class="list"></div>
      </div>
    </div>
    <div id="t-files" hidden></div>
    <div id="t-dirs" hidden></div>
    <div id="t-types" hidden></div>
    <div id="t-procs" hidden></div>
  </section>
</main>
<div id="toast" hidden></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = n => n.toLocaleString('fr-FR');
function fmt(b){ if (b < 1024) return b + ' o'; const u=['Ko','Mo','Go','To','Po']; let i=-1; do { b/=1024; i++; } while (b>=1024 && i<u.length-1); return b.toFixed(b<10?2:b<100?1:0).replace('.',',')+' '+u[i]; }
function dur(ms){ return ms<1000 ? ms+' ms' : ms<60000 ? (ms/1000).toFixed(1).replace('.',',')+' s' : Math.floor(ms/60000)+' min '+Math.round(ms%60000/1000)+' s'; }
const date = t => new Date(t*1000).toLocaleDateString('fr-FR');
async function api(u, opt){ const r = await fetch(u, opt); if (!r.ok) throw new Error((await r.text()).trim()); return r.json(); }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(toast.h); toast.h=setTimeout(()=>t.hidden=true, 4000); }

const ICON_DIR = '<svg class="ic" viewBox="0 0 24 24" fill="currentColor"><path d="M3 6.5A2.5 2.5 0 0 1 5.5 4h4l2 2h7A2.5 2.5 0 0 1 21 8.5v9a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z" opacity=".9"/></svg>';
const ICON_FILE = '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M7 3h7l5 5v12a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v5h5"/></svg>';

const st = { root:null, dir:null, sep:'\\' };
const baseName = p => p.split(st.sep).filter(Boolean).pop() || p;
function parentOf(p){ const i = p.replace(/[\\/]$/,'').lastIndexOf(st.sep); let r = i<0 ? p : p.slice(0,i); if (/^[A-Za-z]:$/.test(r)) r += '\\'; return r || '/'; }

function show(v){
  for (const k of ['home','scan','res']) $('#v-'+k).hidden = k !== v;
  $('#btn-home').hidden = v === 'home';
  $('#btn-rescan').hidden = v !== 'res';
  if (v !== 'res') $('#hdr-info').innerHTML = '';
}

/* ---------- home ---------- */
async function home(){
  show('home');
  const drives = await api('/api/drives');
  $('#drives').innerHTML = drives.map(d => {
    const used = d.total - d.free, pct = d.total ? used/d.total*100 : 0;
    return `<button class="drive" data-path="${esc(d.path)}">
      <div class="drive-top"><span class="drive-letter">${esc(d.path)}</span><span class="tag">${esc(d.kind||'')}</span></div>
      <div class="drive-label">${esc(d.label || 'Sans nom')}${d.fs ? ' · '+esc(d.fs) : ''}</div>
      <div class="bar"><i class="${pct>90?'crit':pct>75?'warn':''}" style="width:${pct.toFixed(1)}%"></i></div>
      <div class="drive-nums"><span><b>${fmt(used)}</b> utilisés (${pct.toFixed(0)} %)</span><span>${fmt(d.free)} libres / ${fmt(d.total)}</span></div>
    </button>`;
  }).join('') || '<div class="empty">Aucun disque détecté.</div>';
}
$('#drives').onclick = e => { const b = e.target.closest('.drive'); if (b) startScan(b.dataset.path); };
$('#custom').onsubmit = e => { e.preventDefault(); const p = $('#custom-path').value.trim(); if (p) startScan(p); };
$('#btn-home').onclick = async () => { await api('/api/cancel',{method:'POST'}).catch(()=>{}); home(); };
$('#btn-rescan').onclick = () => startScan(st.root);
$('#btn-cancel').onclick = () => api('/api/cancel',{method:'POST'});

/* ---------- scan ---------- */
async function startScan(path){
  try { const r = await api('/api/scan?path='+encodeURIComponent(path), {method:'POST'}); st.root = r.root; }
  catch (err) { toast(err.message); return; }
  show('scan'); $('#scan-root').textContent = st.root; poll();
}
async function poll(){
  let s; try { s = await api('/api/status'); } catch { return setTimeout(poll, 500); }
  $('#s-size').textContent = fmt(s.bytes||0);
  $('#s-files').textContent = num(s.files||0);
  $('#s-dirs').textContent = num(s.dirs||0);
  $('#s-rate').textContent = s.elapsed ? num(Math.round(s.files/(s.elapsed/1000))) : '0';
  $('#scan-cur').textContent = s.current || '';
  if (s.state === 'running') return setTimeout(poll, 150);
  if (s.state === 'done') return results(s);
  home();
}

/* ---------- results ---------- */
async function results(s){
  st.root = s.root; st.sep = s.root.includes('\\') ? '\\' : '/';
  show('res');
  $('#hdr-info').innerHTML = `<span class="mono"><b>${esc(s.root)}</b></span><span><b>${fmt(s.bytes)}</b></span>
    <span><b>${num(s.files)}</b> fichiers</span><span><b>${num(s.dirs)}</b> dossiers</span><span>scanné en <b>${dur(s.elapsed)}</b></span>
    ${s.errs ? `<span class="tag warn" title="Lance DiskScope en administrateur / root pour tout voir">${num(s.errs)} dossiers inaccessibles</span>` : ''}`;
  tab('explore');
  await openDir(s.root);
  const [top, dirs, types] = await Promise.all([api('/api/top'), api('/api/topdirs'), api('/api/types')]);
  renderTopFiles(top); renderTopDirs(dirs); renderTypes(types); loadProcs();
}

$('#tabs').onclick = e => { const b = e.target.closest('button'); if (b) tab(b.dataset.t); };
function tab(t){
  for (const b of $('#tabs').children) b.classList.toggle('on', b.dataset.t === t);
  for (const k of ['explore','files','dirs','types','procs']) $('#t-'+k).hidden = k !== t;
  if (t === 'explore' && st.dir) renderTreemap(st.dir);
  if (t === 'procs') loadProcs();
}

async function openDir(path){
  let d; try { d = await api('/api/dir?path='+encodeURIComponent(path)); } catch (err) { toast(err.message); return; }
  st.dir = d;
  tab('explore');
  renderCrumbs(d); renderProcBox(d); renderList(d); renderTreemap(d);
}

function renderCrumbs(d){
  const parts = [{name: d.root, path: d.root}];
  const rel = d.path.slice(d.root.length).split(st.sep).filter(Boolean);
  let acc = d.root;
  for (const r of rel){ acc = acc.endsWith(st.sep) ? acc + r : acc + st.sep + r; parts.push({name:r, path:acc}); }
  $('#crumbs').innerHTML = parts.map(p => `<button data-path="${esc(p.path)}">${esc(p.name)}</button>`).join('<span class="sep">›</span>')
    + `<span class="sum">${fmt(d.size)} · ${num(d.files)} fichiers · ${num(d.dirs)} dossiers</span>`;
}
$('#crumbs').onclick = e => { const b = e.target.closest('button'); if (b) openDir(b.dataset.path); };

function procTable(list, base){
  return `<table><tr><th>Programme</th><th class="r">PID</th><th class="r">RAM</th><th>Exécutable</th></tr>${list.map(p =>
    `<tr class="click" data-path="${esc(parentOf(p.exe))}"><td><b>${esc(p.name)}</b></td><td class="r num">${p.pid}</td>
     <td class="r num">${fmt(p.mem)}</td><td class="path" title="${esc(p.exe)}">${esc(base && p.exe.startsWith(base) ? '…'+p.exe.slice(base.length) : p.exe)}</td></tr>`).join('')}</table>`;
}
function renderProcBox(d){
  const box = $('#procbox');
  if (!d.procs.length){ box.className = 'procbox none'; box.textContent = 'Aucun programme en cours d\'exécution depuis ce dossier.'; return; }
  box.className = 'procbox';
  const ram = d.procs.reduce((s,p)=>s+p.mem,0);
  const n = d.procs.length;
  box.innerHTML = `<details ${n <= 5 ? 'open' : ''}><summary><h3><span class="dot"></span>${n} programme${n>1?'s':''} lancé${n>1?'s':''} depuis ce dossier · ${fmt(ram)} de RAM <span class="tag">${n <= 5 ? 'détails' : 'afficher'}</span></h3></summary>
    <div style="margin-top:10px;max-height:300px;overflow:auto">${procTable(d.procs, d.path)}</div></details>`;
}
document.addEventListener('click', e => { const tr = e.target.closest('tr.click[data-path]'); if (tr) openDir(tr.dataset.path); });

function items(d){
  return [...d.children.map(c => ({...c, dir:true})), ...d.fileList.map(f => ({...f, dir:false}))].sort((a,b) => b.size - a.size);
}
function renderList(d){
  const all = items(d), tot = d.size || 1;
  if (!all.length){ $('#list').innerHTML = '<div class="empty">Dossier vide</div>'; return; }
  $('#list').innerHTML = all.map(i => {
    const pct = i.size/tot*100;
    return `<div class="row ${i.dir?'is-dir':'file'}" ${i.dir?`data-path="${esc(i.path)}"`:''} title="${esc(i.path)}">
      ${i.dir?ICON_DIR:ICON_FILE}
      <span class="nm"><span class="t">${esc(i.name)}</span>${i.err?'<span class="tag warn">accès refusé</span>':''}${i.procs?`<span class="tag run">● ${i.procs} actif${i.procs>1?'s':''}</span>`:''}</span>
      <span class="meta">${i.dir ? num(i.files)+' fich.' : date(i.mod)}</span>
      <span class="pbar"><i style="width:${pct.toFixed(2)}%"></i></span>
      <span class="pct">${pct.toFixed(1).replace('.',',')} %</span>
      <span class="sz">${fmt(i.size)}</span></div>`;
  }).join('') + (d.filesMore ? `<div class="more">+ ${num(d.filesMore)} petits fichiers non listés</div>` : '');
  $('#list').scrollTop = 0;
}
$('#list').onclick = e => { const r = e.target.closest('.row.is-dir'); if (r) openDir(r.dataset.path); };

/* squarified treemap */
function worst(row, sum, side){ let mx=0, mn=Infinity; for (const r of row){ if (r.a>mx) mx=r.a; if (r.a<mn) mn=r.a; } const s2=side*side, q=sum*sum; return Math.max(s2*mx/q, q/(s2*mn)); }
function squarify(list, x, y, w, h, out){
  let i = 0;
  while (i < list.length){
    const side = Math.min(w, h);
    let row = [list[i]], sum = list[i].a, best = worst(row, sum, side), j = i+1;
    while (j < list.length){ const r2 = [...row, list[j]], s2 = sum + list[j].a, w2 = worst(r2, s2, side); if (w2 > best) break; row = r2; sum = s2; best = w2; j++; }
    if (w >= h){ const cw = sum/h; let cy = y; for (const it of row){ const ih = it.a/cw; out.push({it, x, y:cy, w:cw, h:ih}); cy += ih; } x += cw; w -= cw; }
    else { const rh = sum/w; let cx = x; for (const it of row){ const iw = it.a/rh; out.push({it, x:cx, y, w:iw, h:rh}); cx += iw; } y += rh; h -= rh; }
    i = j;
  }
}
function renderTreemap(d){
  const el = $('#treemap'), W = el.clientWidth, H = el.clientHeight;
  if (!W) return;
  let list = items(d).filter(i => i.size > 0);
  const total = list.reduce((s,i) => s+i.size, 0);
  if (!total){ el.innerHTML = '<div class="empty">Rien à afficher</div>'; return; }
  const MAX = 150;
  if (list.length > MAX){ const rest = list.slice(MAX); list = list.slice(0, MAX); list.push({name: rest.length+' autres', size: rest.reduce((s,i)=>s+i.size,0), other:true}); }
  list.forEach(i => i.a = i.size/total*W*H);
  const out = []; squarify(list, 0, 0, W, H, out);
  el.innerHTML = out.map((r, k) => {
    const i = r.it, cls = i.other ? 'other' : i.dir ? 'dir' : 'file', big = r.w > 64 && r.h > 34;
    return `<div class="tile ${cls}" style="left:${r.x}px;top:${r.y}px;width:${r.w}px;height:${r.h}px;--h:${(250 + k*37) % 360}"
      ${i.dir ? `data-path="${esc(i.path)}"` : ''} title="${esc(i.name)} — ${fmt(i.size)} (${(i.size/total*100).toFixed(1)} %)">
      ${big ? `<b>${i.procs ? '● ' : ''}${esc(i.name)}</b><span>${fmt(i.size)}</span>` : ''}</div>`;
  }).join('');
}
$('#treemap').onclick = e => { const t = e.target.closest('.tile.dir'); if (t) openDir(t.dataset.path); };
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => st.dir && renderTreemap(st.dir), 120); });
addEventListener('keydown', e => {
  if ($('#v-res').hidden || $('#t-explore').hidden || e.target.tagName === 'INPUT') return;
  if ((e.key === 'Backspace' || (e.altKey && e.key === 'ArrowUp')) && st.dir?.parent){ e.preventDefault(); openDir(st.dir.parent); }
});

/* other tabs */
function renderTopFiles(list){
  $('#t-files').innerHTML = `<p class="hint">Les ${list.length} plus gros fichiers du scan. Clique pour ouvrir le dossier.</p>
    <table><tr><th>#</th><th>Fichier</th><th>Dossier</th><th class="r">Modifié</th><th class="r">Taille</th></tr>${list.map((f,k) =>
    `<tr class="click" data-path="${esc(parentOf(f.path))}"><td class="num">${k+1}</td><td><b>${esc(baseName(f.path))}</b></td>
     <td class="path" title="${esc(f.path)}">${esc(parentOf(f.path))}</td><td class="r num">${date(f.mod)}</td><td class="r num"><b>${fmt(f.size)}</b></td></tr>`).join('')}</table>`;
}
function renderTopDirs(list){
  $('#t-dirs').innerHTML = `<p class="hint">Dossiers classés par le poids des fichiers qu'ils contiennent directement : caches, téléchargements, vidéos, logs…</p>
    <table><tr><th>Dossier</th><th class="r">Fichiers directs</th><th class="r">Total avec sous-dossiers</th><th class="r">Nb fichiers</th></tr>${list.map(d =>
    `<tr class="click" data-path="${esc(d.path)}"><td class="path" title="${esc(d.path)}">${esc(d.path)}</td>
     <td class="r num"><b>${fmt(d.own)}</b></td><td class="r num">${fmt(d.size)}</td><td class="r num">${num(d.files)}</td></tr>`).join('')}</table>`;
}
function renderTypes(list){
  const max = list[0]?.size || 1;
  $('#t-types').innerHTML = `<p class="hint">Espace occupé par extension de fichier.</p><div class="types">${list.map(t =>
    `<div class="trow"><span class="mono"><b>${esc(t.ext)}</b></span><div class="bar"><i style="width:${(t.size/max*100).toFixed(2)}%"></i></div>
     <span class="num" style="text-align:right">${num(t.count)} fich.</span><span class="num" style="text-align:right"><b>${fmt(t.size)}</b></span></div>`).join('')}</div>`;
}
async function loadProcs(){
  let list; try { list = await api('/api/procs?path='+encodeURIComponent(st.root)); } catch { return; }
  $('#proc-count').textContent = list.length;
  const ram = list.reduce((s,p)=>s+p.mem,0);
  $('#t-procs').innerHTML = `<div class="toolbar"><p class="hint" style="margin:0">${list.length} programme${list.length>1?'s':''} en cours d'exécution depuis <span class="mono">${esc(st.root)}</span> · ${fmt(ram)} de RAM. Clique pour ouvrir leur dossier.</p>
    <button class="btn" onclick="loadProcs()">↻ Actualiser</button></div>` + (list.length ? procTable(list, '') : '<div class="empty">Aucun</div>');
}

/* boot: resume where the server is */
api('/api/status').then(s => {
  if (s.state === 'running'){ st.root = s.root; show('scan'); $('#scan-root').textContent = s.root; poll(); }
  else if (s.state === 'done') results(s);
  else home();
}).catch(home);
</script>
